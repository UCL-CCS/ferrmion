name: Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  python-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Dependencies
        run: |
          uv venv .venv/
          uv sync --all-extras --all-groups
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          run: uv run pytest python/tests/ --codspeed
          mode: walltime
