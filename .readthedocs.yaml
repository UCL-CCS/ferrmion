version: 2

sphinx:
  builder: html
  configuration: docs/source/conf.py

build:
  os: "ubuntu-20.04"
  tools:
    python: "3.13"
    rust: "1.91"
  jobs:
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
      - uv venv
    install:
      - uv sync --all-extras --all-groups
    build:
      html:
        - cargo doc --no-deps --document-private-items
        - uv run sphinx-build -T -b html docs/source/ $READTHEDOCS_OUTPUT/html -j auto
        - cp -r target/doc $READTHEDOCS_OUTPUT/html/rustdoc
