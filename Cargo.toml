[workspace]
members = [".", "crates/ferrmion-core"]
resolver = "2"

[package]
name = "ferrmion"
version = "0.8.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ferrmion"
crate-type = ["cdylib", "lib"]

[dependencies]
ferrmion-core = { path = "crates/ferrmion-core" }
ndarray = { version = "0.16.1", features = ["rayon"] }
numpy = "0.24.0"
pyo3 = { version = "0.24.0", features = ["num-complex"] }
pyo3-log = "0.12.4"
log = { version = "0.4", features = ["release_max_level_info"] }
num-complex = "0.4.6"
tinyvec = "1.11.0"

[dev-dependencies]
proptest = "1.9.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decode_zbasis_ensemble"
harness = false

[profile.profiling]
inherits = "release"
debug = true
