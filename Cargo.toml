[package]
name = "ferrmion"
version = "0.7.3"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ferrmion"
crate-type = ["cdylib", "lib"]

[dependencies]
itertools = "0.14.0"
ndarray = { version = "0.16.1", features = ["rayon"] }
numpy = "0.24.0"
pyo3 = {version = "0.24.0", features = ["num-complex"]}
pyo3-log = "0.12.4"
log = {version ="0.4", features = ["release_max_level_info"]}
ahash = "0.8.12"
rand = "0.9.2"
rand_xoshiro = "0.7.0"
argmin = "0.10.0"
num-complex = "0.4.6"
tinyvec = "1.10.0"
thiserror = "2.0.17"
rayon = "1.11.0"
num_cpus = "1.17.0"

[dev-dependencies]
proptest = "1.9.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decode_zbasis_ensemble"
harness = false

[profile.profiling]
inherits = "release"
debug = true
