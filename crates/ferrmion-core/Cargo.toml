[package]
name = "ferrmion-core"
version = "0.10.0"
edition = "2021"
description = "Fast, easy and optimised fermion-qubit encodings."

[lib]
name = "ferrmion_core"
crate-type = ["lib"]

[dependencies]
itertools = "0.14.0"
ndarray = { version = "0.16.1", features = ["rayon"] }
num-complex = "0.4.6"
rayon = "1.11.0"
log = { version = "0.4", features = ["release_max_level_info"] }
argmin = "0.10.0"
rand = "0.9.2"
rand_xoshiro = "0.7.0"
# argmin 0.10 pins rand_xoshiro 0.6 internally; the solver's `new_with_rng`
# requires an RNG implementing the older `rand_core::RngCore`. We expose this
# alongside the modern crate so we can seed argmin's solver deterministically.
rand_xoshiro_legacy = { package = "rand_xoshiro", version = "0.6.0" }
rand_core_legacy = { package = "rand_core", version = "0.6.4" }
ahash = "0.8.12"
tinyvec = "1.10.0"
thiserror = "2.0.17"
bitvec = "1.1.1"

[dev-dependencies]
proptest = "1.9.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "topphatt_bitvec"
harness = false
